# Catch-all. Without this, nginx serves the first-loaded site to any request
# carrying an unknown Host header — including a bare IP address — so the API
# would answer on a name it was never configured for.
#
# Installed by ./scripts/deploy.sh nginx, which also removes Ubuntu's packaged
# default site. By hand:
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo cp 00-default-server.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/00-default-server.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Certbot's webroot challenge still has to work for a bare-IP request.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 444;
    }
}
