# Krishi Sech API — reverse proxy in front of the api container on 7001.
#
# HTTP only. Certbot's nginx plugin rewrites this block in place: it adds the
# 443 listener, the certificate paths and the HTTP->HTTPS redirect.
#
#   sudo cp stage-api.krishisech.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/stage-api.krishisech.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stage-api.krishisech.com
#   sudo certbot renew --dry-run
#
# Requires TRUST_PROXY=true in server/.env. Without it Express reads the socket
# address, so every farmer shares this proxy's IP and one of them can exhaust
# everyone's OTP and rate-limit budget.

upstream krishi_api {
    server 127.0.0.1:7001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name stage-api.krishisech.com;

    # Disease-scan uploads are capped at 2 MB by multer; this leaves room for
    # multipart overhead. Nginx's 1 MB default would reject them with a 413
    # that never reaches the app, so the error would not look like an upload
    # limit at all.
    client_max_body_size 3m;

    # The app's own budget is REQUEST_TIMEOUT_MS (20s) and telemetry allows
    # 30s, so nginx must outlast both or it would mask the app's own error.
    proxy_connect_timeout 10s;
    proxy_send_timeout    65s;
    proxy_read_timeout    65s;

    access_log /var/log/nginx/krishi-api.access.log;
    error_log  /var/log/nginx/krishi-api.error.log;

    # Add once HTTPS is confirmed working — certbot does not set this, and it
    # is hard to walk back:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://krishi_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # REPLACED, never appended: with $proxy_add_x_forwarded_for a client
        # could prepend an address of its choosing. Only what this proxy
        # observed is trustworthy.
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Certbot adds the 443 block; $scheme then reports https there and
        # http here, which is what the redirect it writes relies on.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # $request_id is 32 hex characters, which satisfies the server's
        # ^[A-Za-z0-9._-]{8,128}$ check, so traces line up across both logs.
        proxy_set_header X-Request-ID      $request_id;
        # Required for upstream keepalive.
        proxy_set_header Connection        "";
    }

    # CORS is answered by the application, including preflight (it returns 204
    # for OPTIONS). Adding Access-Control-* headers here would duplicate them
    # and browsers reject a response carrying two.
}
