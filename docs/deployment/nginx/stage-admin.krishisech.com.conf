# Krishi Sech admin panel — reverse proxy in front of the web container on 7002.
#
# HTTP only; certbot --nginx adds TLS and the redirect.
#
# Replace stage-admin.krishisech.com throughout with the hostname you actually
# serve the panel from. That hostname is also what the API must allow as an
# Origin, so set it as CORS_ALLOWED_ORIGINS in ./.env — and remember the API
# URL is compiled into the panel's bundle, so it needs a rebuild:
#   ./scripts/docker.sh build web && ./scripts/docker.sh up
#
#   sudo certbot --nginx -d stage-admin.krishisech.com

upstream krishi_web {
    server 127.0.0.1:7002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stage-admin.krishisech.com;

    access_log /var/log/nginx/krishi-admin.access.log;
    error_log  /var/log/nginx/krishi-admin.error.log;

    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://krishi_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Next already sets the right caching on its own responses: immutable for
    # /_next/static, and no-store for /admin/*, which is what keeps live farmer
    # data out of a shared desktop's back/forward cache. Overriding either from
    # here would break one of them, so nothing is added.
}
