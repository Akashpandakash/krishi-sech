# yaml-language-server: $schema=https://raw.githubusercontent.com/render-oss/render-spec/main/render.yaml.json
# Importing this Blueprint creates resources. Review it in Render before applying.
previews:
  generation: off

services:
  - type: web
    name: krishi-sech-api-staging
    runtime: node
    region: singapore
    plan: starter
    domains:
      - staging-api.krishisech.com
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: krishi-sech-db-staging
          property: connectionString
      - key: REQUEST_TIMEOUT_MS
        value: "20000"
      - key: LOGGING_ENABLED
        value: "false"
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: DEBUG_OTP_ENABLED
        value: "false"
      - key: OPENAI_ENABLED
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: WEATHER_PROVIDER
        value: open-meteo
      - key: WEATHER_API_BASE_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "60"
      - key: AI_RATE_LIMIT_MAX
        value: "30"
      - key: OTP_REQUEST_WINDOW_SECONDS
        value: "600"
      - key: OTP_MAX_REQUESTS_PER_WINDOW
        value: "3"
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_SENDER_ID
        sync: false
      - key: FAST2SMS_ROUTE
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true

  - type: web
    name: krishi-sech-api-production
    runtime: node
    region: singapore
    plan: starter
    domains:
      - api.krishisech.com
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: krishi-sech-db-production
          property: connectionString
      - key: REQUEST_TIMEOUT_MS
        value: "20000"
      - key: LOGGING_ENABLED
        value: "false"
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: DEBUG_OTP_ENABLED
        value: "false"
      - key: OPENAI_ENABLED
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: WEATHER_PROVIDER
        value: open-meteo
      - key: WEATHER_API_BASE_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://krishisech.com,https://www.krishisech.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "60"
      - key: AI_RATE_LIMIT_MAX
        value: "30"
      - key: OTP_REQUEST_WINDOW_SECONDS
        value: "600"
      - key: OTP_MAX_REQUESTS_PER_WINDOW
        value: "3"
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_SENDER_ID
        sync: false
      - key: FAST2SMS_ROUTE
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true

databases:
  - name: krishi-sech-db-staging
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: krishi_sech_staging
    user: krishi_sech_staging
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    connectionPool: none
    ipAllowList: []

  - name: krishi-sech-db-production
    region: singapore
    plan: basic-1gb
    postgresMajorVersion: "17"
    databaseName: krishi_sech_production
    user: krishi_sech_production
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    connectionPool: none
    ipAllowList: []
