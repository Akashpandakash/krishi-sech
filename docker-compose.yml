# Local and single-host stack: MongoDB, the Express API, and the admin panel.
#
# Run it through ./scripts/docker.sh, which validates the environment first.
# `docker compose up` works directly too, but skips those checks.
#
# Compose-level values (ports, image tags, the API origin baked into the panel)
# come from the .env file beside this one — see .env.example. Backend secrets
# stay in server/.env and are never duplicated here.
name: krishi-sech

services:
  mongo:
    image: mongo:${MONGO_VERSION:-7}
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Bound to loopback: the API reaches it over the compose network, and
    # nothing on the LAN should be able to.
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # These four win over server/.env (compose precedence), which is
      # deliberate: inside a container `localhost` is the container itself, and
      # the stack must never silently reach the remote database named in a
      # developer's server/.env. Point MONGODB_URI in ./.env at Atlas to
      # override.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/krishi_sech}
      HOST: 0.0.0.0
      PORT: '7001'
      # The panel is a browser origin and must be allowed explicitly.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:7002}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${API_PORT:-7001}:7001'

  web:
    build:
      context: ./web
      args:
        # Inlined into the client bundle at build time, so a change here needs
        # a rebuild, not a restart.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:7001}
    restart: unless-stopped
    environment:
      PORT: '7002'
      HOSTNAME: 0.0.0.0
    depends_on:
      # Started only, not awaited: the panel renders a sign-in screen fine
      # while the API is still coming up.
      - api
    ports:
      - '${WEB_PORT:-7002}:7002'

volumes:
  mongo-data:
