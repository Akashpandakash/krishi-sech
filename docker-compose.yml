# Local and single-host stack: MongoDB, the Express API, and the admin panel.
#
# Run it through ./scripts/docker.sh, which validates the environment first.
# `docker compose up` works directly too, but skips those checks.
#
# Compose-level values (ports, image tags, the API origin baked into the panel)
# come from the .env file beside this one — see .env.example. Backend secrets
# stay in server/.env and are never duplicated here.
name: krishi-sech

services:
  # Optional. The database is normally hosted (Atlas), so this only starts when
  # you ask for it:  COMPOSE_PROFILES=local-db  in .env, or --profile local-db.
  # Using it means pointing MONGODB_URI at mongodb://mongo:27017/krishi_sech.
  mongo:
    image: mongo:${MONGO_VERSION:-7}
    profiles: [local-db]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Bound to loopback: the API reaches it over the compose network, and
    # nothing on the LAN should be able to.
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Named with no value: passed through ONLY when .env defines it, so an
      # unset MONGODB_URI here leaves server/.env's value in place instead of
      # blanking it. Set it in whichever of the two files you prefer; this one
      # wins when both do.
      - MONGODB_URI
      # Inside a container `localhost` is the container itself, so the bind
      # address is ours to set, not server/.env's.
      - HOST=0.0.0.0
      - PORT=7001
      # The panel is a browser origin and must be allowed explicitly. Same
      # pass-through rule as MONGODB_URI, and for a sharper reason: a default
      # here (this line used to read `:-http://localhost:7002`) OVERRIDES
      # server/.env whenever ./.env omits the key, so a correctly configured
      # backend still answered the panel with 403 ORIGIN_NOT_ALLOWED. That
      # rejection is also invisible — the CORS middleware runs before the
      # request logger — so the only symptom is "Could not reach the API".
      # ./.env.example ships the localhost:7002 value for local development.
      - CORS_ALLOWED_ORIGINS
      # Behind Nginx this must be true, or rate limiting and OTP throttling see
      # the proxy's IP for every farmer and one of them exhausts the budget for
      # all. Left to server/.env when ./.env does not set it.
      - TRUST_PROXY
      # Lets ./.env declare the deployment's identity. Worth setting: at
      # development the server defaults DEMO_LOGIN_ENABLED and DEBUG_OTP_ENABLED
      # to true, which on a public host hands out OTPs in API responses.
      - APP_ENV
    # No depends_on: mongo is behind a profile and usually absent, and Compose
    # rejects a dependency on a service the active profiles exclude. When the
    # local-db profile IS on, /api/ready covers the startup order — the API
    # reports not-ready until its first successful ping.
    # Loopback by default: with Nginx terminating TLS in front, publishing on
    # 0.0.0.0 would leave the API reachable over plain HTTP on :7001, bypassing
    # the certificate and HSTS entirely. Set BIND_ADDRESS=0.0.0.0 in .env only
    # when nothing fronts it — a laptop serving a phone on the same LAN.
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-7001}:7001'

  web:
    build:
      context: ./web
      args:
        # Inlined into the client bundle at build time, so a change here needs
        # a rebuild, not a restart.
        #
        # No `:-http://localhost:7001` default, deliberately. web/Dockerfile
        # refuses to build without this value precisely so a panel can never
        # ship hard-wired to localhost — but a default here SATISFIES that
        # guard with the very value it exists to prevent, and the panel then
        # fails in the browser with a bare "Could not reach the API". Leaving
        # it unset makes the build fail loudly instead. ./.env.example ships
        # the localhost value for local development.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      PORT: '7002'
      HOSTNAME: 0.0.0.0
    depends_on:
      # Started only, not awaited: the panel renders a sign-in screen fine
      # while the API is still coming up.
      - api
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-7002}:7002'

volumes:
  mongo-data:
